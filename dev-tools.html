<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadowverse Beyond - 开发者工具</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .header {
            background: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
        }
        .content {
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .panel {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            border-left: 4px solid #3498db;
        }
        .panel h3 {
            margin-top: 0;
            color: #2c3e50;
        }
        .btn {
            background: #3498db;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
            transition: background 0.3s;
        }
        .btn:hover {
            background: #2980b9;
        }
        .btn.danger {
            background: #e74c3c;
        }
        .btn.danger:hover {
            background: #c0392b;
        }
        .btn.success {
            background: #27ae60;
        }
        .btn.success:hover {
            background: #229954;
        }
        .input-group {
            margin: 10px 0;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .input-group input, .input-group select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .log-panel {
            grid-column: 1 / -1;
            background: #2c3e50;
            color: #ecf0f1;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            max-height: 300px;
            overflow-y: auto;
        }
        .status {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
        .status.connected {
            background: #27ae60;
            color: white;
        }
        .status.disconnected {
            background: #e74c3c;
            color: white;
        }
        .quick-actions {
            grid-column: 1 / -1;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            padding: 20px;
            background: #ecf0f1;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🛠️ Shadowverse Beyond 开发者工具</h1>
            <p>快速测试和调试游戏功能</p>
            <div>
                连接状态: <span id="connectionStatus" class="status disconnected">未连接</span>
            </div>
        </div>

        <div class="content">
            <!-- 连接管理面板 -->
            <div class="panel">
                <h3>🔌 连接管理</h3>
                <div class="input-group">
                    <label>服务器地址:</label>
                    <input type="text" id="serverUrl" value="http://localhost:5000">
                </div>
                <button class="btn" onclick="connectToServer()">连接服务器</button>
                <button class="btn danger" onclick="disconnectFromServer()">断开连接</button>
            </div>

            <!-- 游戏管理面板 -->
            <div class="panel">
                <h3>🎮 游戏管理</h3>
                <div class="input-group">
                    <label>游戏ID:</label>
                    <input type="text" id="gameId" value="dev-test-game">
                </div>
                <div class="input-group">
                    <label>玩家ID:</label>
                    <input type="text" id="playerId" value="dev-player-1">
                </div>
                <button class="btn success" onclick="createGame()">创建游戏</button>
                <button class="btn" onclick="joinGame()">加入游戏</button>
                <button class="btn danger" onclick="leaveGame()">离开游戏</button>
            </div>

            <!-- 卡牌测试面板 -->
            <div class="panel">
                <h3>🃏 卡牌测试</h3>
                <div class="input-group">
                    <label>卡牌ID:</label>
                    <input type="number" id="cardId" value="1">
                </div>
                <div class="input-group">
                    <label>目标UID:</label>
                    <input type="text" id="targetUid" placeholder="可选">
                </div>
                <button class="btn" onclick="playCard()">出牌</button>
                <button class="btn" onclick="addCardToHand()">添加到手牌</button>
            </div>

            <!-- 战斗测试面板 -->
            <div class="panel">
                <h3>⚔️ 战斗测试</h3>
                <div class="input-group">
                    <label>攻击者UID:</label>
                    <input type="text" id="attackerUid">
                </div>
                <div class="input-group">
                    <label>目标UID:</label>
                    <input type="text" id="attackTargetUid">
                </div>
                <button class="btn" onclick="attack()">攻击</button>
                <button class="btn" onclick="evolve()">进化</button>
                <button class="btn" onclick="endTurn()">结束回合</button>
            </div>

            <!-- 快速操作 -->
            <div class="quick-actions">
                <button class="btn success" onclick="quickSetup()">🚀 快速设置</button>
                <button class="btn" onclick="addTestCards()">📋 添加测试卡牌</button>
                <button class="btn" onclick="setMaxResources()">💎 最大资源</button>
                <button class="btn" onclick="skipToTurn(5)">⏭️ 跳到第5回合</button>
                <button class="btn danger" onclick="resetGame()">🔄 重置游戏</button>
                <button class="btn" onclick="exportGameState()">📤 导出状态</button>
                <button class="btn" onclick="clearLog()">🗑️ 清空日志</button>
            </div>

            <!-- 日志面板 -->
            <div class="log-panel">
                <h3>📋 操作日志</h3>
                <div id="logContent">等待连接...</div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/@microsoft/signalr@latest/dist/browser/signalr.min.js"></script>
    <script>
        let connection = null;
        let currentGameId = null;
        let currentPlayerId = null;

        function log(message, type = 'info') {
            const logContent = document.getElementById('logContent');
            const timestamp = new Date().toLocaleTimeString();
            const colorMap = {
                'info': '#3498db',
                'success': '#27ae60',
                'error': '#e74c3c',
                'warning': '#f39c12'
            };
            
            logContent.innerHTML += `<div style="color: ${colorMap[type] || '#ecf0f1'}">
                [${timestamp}] ${message}
            </div>`;
            logContent.scrollTop = logContent.scrollHeight;
        }

        async function connectToServer() {
            const serverUrl = document.getElementById('serverUrl').value;
            
            try {
                connection = new signalR.HubConnectionBuilder()
                    .withUrl(`${serverUrl}/gameHub`)
                    .build();

                // 注册事件监听器
                connection.on("GameStateUpdated", (gameState) => {
                    log(`游戏状态更新: ${JSON.stringify(gameState, null, 2)}`, 'info');
                });

                connection.on("GameEventOccurred", (events) => {
                    log(`游戏事件: ${JSON.stringify(events, null, 2)}`, 'success');
                });

                connection.on("ErrorOccurred", (error) => {
                    log(`错误: ${error}`, 'error');
                });

                await connection.start();
                document.getElementById('connectionStatus').textContent = '已连接';
                document.getElementById('connectionStatus').className = 'status connected';
                log('成功连接到服务器', 'success');
            } catch (error) {
                log(`连接失败: ${error}`, 'error');
            }
        }

        async function disconnectFromServer() {
            if (connection) {
                await connection.stop();
                document.getElementById('connectionStatus').textContent = '未连接';
                document.getElementById('connectionStatus').className = 'status disconnected';
                log('已断开连接', 'warning');
            }
        }

        async function createGame() {
            if (!connection) {
                log('请先连接服务器', 'error');
                return;
            }

            const gameId = document.getElementById('gameId').value;
            const playerId = document.getElementById('playerId').value;

            try {
                await connection.invoke("CreateGame", gameId, playerId);
                currentGameId = gameId;
                currentPlayerId = playerId;
                log(`创建游戏成功: ${gameId}`, 'success');
            } catch (error) {
                log(`创建游戏失败: ${error}`, 'error');
            }
        }

        async function joinGame() {
            if (!connection) {
                log('请先连接服务器', 'error');
                return;
            }

            const gameId = document.getElementById('gameId').value;
            const playerId = document.getElementById('playerId').value;

            try {
                await connection.invoke("JoinGame", gameId, playerId);
                currentGameId = gameId;
                currentPlayerId = playerId;
                log(`加入游戏成功: ${gameId}`, 'success');
            } catch (error) {
                log(`加入游戏失败: ${error}`, 'error');
            }
        }

        async function playCard() {
            if (!connection || !currentGameId || !currentPlayerId) {
                log('请先创建或加入游戏', 'error');
                return;
            }

            const cardId = document.getElementById('cardId').value;
            const targetUid = document.getElementById('targetUid').value || null;

            try {
                await connection.invoke("PlayCard", currentGameId, currentPlayerId, cardId, targetUid);
                log(`出牌: 卡牌ID ${cardId}`, 'success');
            } catch (error) {
                log(`出牌失败: ${error}`, 'error');
            }
        }

        async function attack() {
            if (!connection || !currentGameId || !currentPlayerId) {
                log('请先创建或加入游戏', 'error');
                return;
            }

            const attackerUid = document.getElementById('attackerUid').value;
            const targetUid = document.getElementById('attackTargetUid').value;

            try {
                await connection.invoke("Attack", currentGameId, currentPlayerId, attackerUid, targetUid);
                log(`攻击: ${attackerUid} -> ${targetUid}`, 'success');
            } catch (error) {
                log(`攻击失败: ${error}`, 'error');
            }
        }

        async function endTurn() {
            if (!connection || !currentGameId || !currentPlayerId) {
                log('请先创建或加入游戏', 'error');
                return;
            }

            try {
                await connection.invoke("EndTurn", currentGameId, currentPlayerId);
                log('结束回合', 'success');
            } catch (error) {
                log(`结束回合失败: ${error}`, 'error');
            }
        }

        function quickSetup() {
            document.getElementById('gameId').value = 'dev-test-' + Date.now();
            document.getElementById('playerId').value = 'dev-player-' + Math.floor(Math.random() * 1000);
            log('快速设置完成', 'success');
        }

        function clearLog() {
            document.getElementById('logContent').innerHTML = '';
        }

        // 页面加载时自动连接
        window.addEventListener('load', () => {
            log('开发者工具已加载', 'info');
        });
    </script>
</body>
</html>
