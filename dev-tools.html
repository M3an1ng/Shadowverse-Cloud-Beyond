<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shadowverse Beyond - 开发者工具</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        padding: 20px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: #333;
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
        background: white;
        border-radius: 10px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        overflow: hidden;
      }
      .header {
        background: #2c3e50;
        color: white;
        padding: 20px;
        text-align: center;
      }
      .content {
        padding: 20px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }
      .panel {
        background: #f8f9fa;
        border-radius: 8px;
        padding: 15px;
        border-left: 4px solid #3498db;
      }
      .panel h3 {
        margin-top: 0;
        color: #2c3e50;
      }
      .btn {
        background: #3498db;
        color: white;
        border: none;
        padding: 10px 15px;
        border-radius: 5px;
        cursor: pointer;
        margin: 5px;
        transition: background 0.3s;
      }
      .btn:hover {
        background: #2980b9;
      }
      .btn.danger {
        background: #e74c3c;
      }
      .btn.danger:hover {
        background: #c0392b;
      }
      .btn.success {
        background: #27ae60;
      }
      .btn.success:hover {
        background: #229954;
      }
      .input-group {
        margin: 10px 0;
      }
      .input-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
      }
      .input-group input,
      .input-group select {
        width: 100%;
        padding: 8px;
        border: 1px solid #ddd;
        border-radius: 4px;
        box-sizing: border-box;
      }
      .log-panel {
        grid-column: 1 / -1;
        background: #2c3e50;
        color: #ecf0f1;
        padding: 15px;
        border-radius: 8px;
        font-family: "Courier New", monospace;
        max-height: 300px;
        overflow-y: auto;
      }
      .status {
        display: inline-block;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 12px;
        font-weight: bold;
      }
      .status.connected {
        background: #27ae60;
        color: white;
      }
      .status.disconnected {
        background: #e74c3c;
        color: white;
      }
      .quick-actions {
        grid-column: 1 / -1;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
        padding: 20px;
        background: #ecf0f1;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>🛠️ Shadowverse Beyond 开发者工具</h1>
        <p>快速测试和调试游戏功能</p>
        <div>
          连接状态:
          <span id="connectionStatus" class="status disconnected">未连接</span>
        </div>
      </div>

      <div class="content">
        <!-- 连接管理面板 -->
        <div class="panel">
          <h3>🔌 连接管理</h3>
          <div class="input-group">
            <label>服务器地址:</label>
            <input type="text" id="serverUrl" value="http://localhost:5100" />
          </div>
          <button class="btn" onclick="connectToServer()">连接服务器</button>
          <button class="btn danger" onclick="disconnectFromServer()">
            断开连接
          </button>
        </div>

        <!-- 游戏管理面板 -->
        <div class="panel">
          <h3>🎮 游戏管理</h3>
          <div class="input-group">
            <label>游戏ID:</label>
            <input type="text" id="gameId" value="dev-test-game" />
          </div>
          <div class="input-group">
            <label>玩家ID:</label>
            <input type="text" id="playerId" value="dev-player-1" />
          </div>
          <button class="btn success" onclick="createGame()">创建游戏</button>
          <button class="btn" onclick="joinGame()">加入游戏</button>
          <button class="btn danger" onclick="leaveGame()">离开游戏</button>
        </div>

        <!-- 卡牌测试面板 -->
        <div class="panel">
          <h3>🃏 卡牌测试</h3>
          <div class="input-group">
            <label>卡牌UID:</label>
            <input type="text" id="cardId" placeholder="卡牌实例的GUID" />
          </div>
          <div class="input-group">
            <label>目标UID:</label>
            <input type="text" id="targetUid" placeholder="目标的GUID (可选)" />
          </div>
          <button class="btn" onclick="playCard()">出牌</button>
          <button class="btn" onclick="addCardToHand()">添加到手牌</button>
        </div>

        <!-- 战斗测试面板 -->
        <div class="panel">
          <h3>⚔️ 战斗测试</h3>
          <div class="input-group">
            <label>攻击者UID:</label>
            <input type="text" id="attackerUid" placeholder="攻击单位的GUID" />
          </div>
          <div class="input-group">
            <label>攻击目标UID:</label>
            <input
              type="text"
              id="attackTargetUid"
              placeholder="目标单位或玩家的GUID"
            />
          </div>
          <div class="input-group">
            <label>进化单位UID:</label>
            <input type="text" id="unitUid" placeholder="要进化单位的GUID" />
          </div>
          <button class="btn" onclick="attack()">攻击</button>
          <button class="btn" onclick="evolve()">进化</button>
          <button class="btn" onclick="endTurn()">结束回合</button>
        </div>

        <!-- 快速操作 -->
        <div class="quick-actions">
          <button class="btn success" onclick="quickSetup()">
            🚀 快速设置
          </button>
          <button class="btn" onclick="addTestCards()">📋 添加测试卡牌</button>
          <button class="btn" onclick="setMaxResources()">💎 最大资源</button>
          <button class="btn" onclick="skipToTurn(5)">⏭️ 跳到第5回合</button>
          <button class="btn danger" onclick="resetGame()">🔄 重置游戏</button>
          <button class="btn" onclick="exportGameState()">📤 导出状态</button>
          <button class="btn" onclick="clearLog()">🗑️ 清空日志</button>
        </div>

        <!-- 日志面板 -->
        <div class="log-panel">
          <h3>📋 操作日志</h3>
          <div id="logContent">等待连接...</div>
        </div>
      </div>
    </div>

    <script src="https://unpkg.com/@microsoft/signalr@latest/dist/browser/signalr.min.js"></script>
    <script>
      let connection = null;
      let currentGameId = null;
      let currentPlayerId = null;

      function log(message, type = "info") {
        const logContent = document.getElementById("logContent");
        const timestamp = new Date().toLocaleTimeString();
        const colorMap = {
          info: "#3498db",
          success: "#27ae60",
          error: "#e74c3c",
          warning: "#f39c12",
        };

        logContent.innerHTML += `<div style="color: ${colorMap[type] || "#ecf0f1"}">
                [${timestamp}] ${message}
            </div>`;
        logContent.scrollTop = logContent.scrollHeight;
      }

      async function connectToServer() {
        const serverUrl = document.getElementById("serverUrl").value;
        const gameId =
          document.getElementById("gameId").value || "dev-test-game";
        const playerId =
          document.getElementById("playerId").value || "dev-player-1";

        try {
          // Use correct hub URL with connection parameters
          const hubUrlWithParams = `${serverUrl}/gamehub?gameId=${encodeURIComponent(gameId)}&playerId=${encodeURIComponent(playerId)}`;

          connection = new signalR.HubConnectionBuilder()
            .withUrl(hubUrlWithParams)
            .withAutomaticReconnect()
            .configureLogging(signalR.LogLevel.Information)
            .build();

          // Register current event handlers from IGameClient interface
          connection.on("ReceiveGameState", (gameState) => {
            log(`游戏状态更新: ${JSON.stringify(gameState, null, 2)}`, "info");
          });

          connection.on("ReceiveError", (error) => {
            log(`错误: ${error}`, "error");
          });

          // Register specific event handlers for current event types
          connection.on("CardPlayed", (eventDto) => {
            log(
              `卡牌出牌事件: ${JSON.stringify(eventDto, null, 2)}`,
              "success",
            );
          });

          connection.on("CardSummoned", (eventDto) => {
            log(
              `卡牌召唤事件: ${JSON.stringify(eventDto, null, 2)}`,
              "success",
            );
          });

          connection.on("TurnStarted", (eventDto) => {
            log(
              `回合开始事件: ${JSON.stringify(eventDto, null, 2)}`,
              "success",
            );
          });

          connection.on("TurnEnded", (eventDto) => {
            log(
              `回合结束事件: ${JSON.stringify(eventDto, null, 2)}`,
              "success",
            );
          });

          connection.on("AttackDeclared", (eventDto) => {
            log(
              `攻击声明事件: ${JSON.stringify(eventDto, null, 2)}`,
              "success",
            );
          });

          connection.on("DamageDealt", (eventDto) => {
            log(
              `伤害造成事件: ${JSON.stringify(eventDto, null, 2)}`,
              "success",
            );
          });

          connection.on("UnitDestroyed", (eventDto) => {
            log(
              `单位破坏事件: ${JSON.stringify(eventDto, null, 2)}`,
              "success",
            );
          });

          connection.on("UnitEvolved", (eventDto) => {
            log(
              `单位进化事件: ${JSON.stringify(eventDto, null, 2)}`,
              "success",
            );
          });

          connection.on("GameOver", (eventDto) => {
            log(
              `游戏结束事件: ${JSON.stringify(eventDto, null, 2)}`,
              "warning",
            );
          });

          await connection.start();
          currentGameId = gameId;
          currentPlayerId = playerId;
          document.getElementById("connectionStatus").textContent = "已连接";
          document.getElementById("connectionStatus").className =
            "status connected";
          log(
            `成功连接到服务器 - 游戏ID: ${gameId}, 玩家ID: ${playerId}`,
            "success",
          );
        } catch (error) {
          log(`连接失败: ${error}`, "error");
        }
      }

      async function disconnectFromServer() {
        if (connection) {
          await connection.stop();
          document.getElementById("connectionStatus").textContent = "未连接";
          document.getElementById("connectionStatus").className =
            "status disconnected";
          log("已断开连接", "warning");
        }
      }

      async function createGame() {
        if (!connection) {
          log("请先连接服务器", "error");
          return;
        }

        // Game creation is now handled automatically by connection
        // The backend creates/joins game based on connection parameters
        log(
          `游戏会话已通过连接建立 - 游戏ID: ${currentGameId}, 玩家ID: ${currentPlayerId}`,
          "success",
        );
      }

      async function joinGame() {
        if (!connection) {
          log("请先连接服务器", "error");
          return;
        }

        // Game joining is now handled automatically by connection
        // The backend creates/joins game based on connection parameters
        log(
          `游戏会话已通过连接建立 - 游戏ID: ${currentGameId}, 玩家ID: ${currentPlayerId}`,
          "success",
        );
      }

      async function playCard() {
        if (!connection || !currentGameId || !currentPlayerId) {
          log("请先创建或加入游戏", "error");
          return;
        }

        const cardUid = document.getElementById("cardId").value;
        const targetUid = document.getElementById("targetUid").value || null;

        // Validate GUID format
        if (!isValidGuid(cardUid)) {
          log(`无效的卡牌UID格式: ${cardUid}`, "error");
          return;
        }

        try {
          // Use current PlayCardActionDto structure
          const actionDto = {
            CardUid: cardUid,
            TargetUids: targetUid ? [targetUid] : [],
          };

          await connection.invoke("PlayCard", actionDto);
          log(`出牌: 卡牌UID ${cardUid}`, "success");
        } catch (error) {
          log(`出牌失败: ${error}`, "error");
        }
      }

      async function attack() {
        if (!connection || !currentGameId || !currentPlayerId) {
          log("请先创建或加入游戏", "error");
          return;
        }

        const attackerUid = document.getElementById("attackerUid").value;
        const targetUid = document.getElementById("attackTargetUid").value;

        // Validate GUID formats
        if (!isValidGuid(attackerUid) || !isValidGuid(targetUid)) {
          log(
            `无效的UID格式 - 攻击者: ${attackerUid}, 目标: ${targetUid}`,
            "error",
          );
          return;
        }

        try {
          // Use current AttackActionDto structure
          const actionDto = {
            AttackerUid: attackerUid,
            TargetUid: targetUid,
          };

          await connection.invoke("PerformAttack", actionDto);
          log(`攻击: ${attackerUid} -> ${targetUid}`, "success");
        } catch (error) {
          log(`攻击失败: ${error}`, "error");
        }
      }

      async function endTurn() {
        if (!connection || !currentGameId || !currentPlayerId) {
          log("请先创建或加入游戏", "error");
          return;
        }

        try {
          // Generate unique request ID for idempotency
          const requestId = generateRequestId();
          await connection.invoke("EndTurn", requestId);
          log(`结束回合 (请求ID: ${requestId})`, "success");
        } catch (error) {
          log(`结束回合失败: ${error}`, "error");
        }
      }

      // Add evolve function
      async function evolve() {
        if (!connection || !currentGameId || !currentPlayerId) {
          log("请先创建或加入游戏", "error");
          return;
        }

        const unitUid = document.getElementById("unitUid").value;

        if (!unitUid) {
          log("请输入单位UID", "error");
          return;
        }

        try {
          // Use current EvolveActionDto structure
          const actionDto = {
            UnitUid: unitUid,
          };

          await connection.invoke("PerformEvolve", actionDto);
          log(`进化: 单位UID ${unitUid}`, "success");
        } catch (error) {
          log(`进化失败: ${error}`, "error");
        }
      }

      // Helper functions
      function isValidGuid(str) {
        if (!str || typeof str !== "string") {
          return false;
        }
        const guidRegex =
          /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
        return guidRegex.test(str);
      }

      function generateRequestId() {
        return (
          "req_" + Date.now() + "_" + Math.random().toString(36).substr(2, 9)
        );
      }

      function quickSetup() {
        const timestamp = Date.now();
        document.getElementById("gameId").value = "dev-test-" + timestamp;
        document.getElementById("playerId").value =
          "dev-player-" + Math.floor(Math.random() * 1000);
        log("快速设置完成", "success");
      }

      function clearLog() {
        document.getElementById("logContent").innerHTML = "";
      }

      // Add test functions for common scenarios
      function addTestCards() {
        log("添加测试卡牌功能暂未实现 - 需要后端支持", "warning");
      }

      function addCardToHand() {
        log("添加卡牌到手牌功能暂未实现 - 需要后端支持", "warning");
      }

      function setMaxResources() {
        log("设置最大资源功能暂未实现 - 需要后端支持", "warning");
      }

      function skipToTurn(turnNumber) {
        log(`跳转到第${turnNumber}回合功能暂未实现 - 需要后端支持`, "warning");
      }

      function resetGame() {
        log("重置游戏功能暂未实现 - 需要后端支持", "warning");
      }

      function exportGameState() {
        if (connection && connection.state === "Connected") {
          log(
            "游戏状态导出功能暂未实现 - 可通过ReceiveGameState事件查看状态",
            "warning",
          );
        } else {
          log("请先连接服务器", "error");
        }
      }

      // 页面加载时自动连接
      window.addEventListener("load", () => {
        log("开发者工具已加载 - 请设置游戏ID和玩家ID后连接服务器", "info");
      });
    </script>
  </body>
</html>
