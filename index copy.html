<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadowverse:World Beyond</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🃏</text></svg>">
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="src/styles/theme.css">
    <link rel="stylesheet" href="src/styles/global.css">
    <link rel="stylesheet" href="src/styles/components.css">
    <link rel="stylesheet" href="src/styles/layout.css">
    <link rel="stylesheet" href="src/styles/main-menu.css">
    <link rel="stylesheet" href="src/styles/animations.css">
    <link rel="stylesheet" href="src/styles/forms.css">
    <link rel="stylesheet" href="src/styles/devtools.css">
    <link rel="stylesheet" href="src/styles/game.css"> <!-- Legacy styles, to be refactored -->
    <link rel="stylesheet" href="src/styles/ability-editor.css">
    
    <!-- defer 确保在 HTML 解析完成后执行脚本 -->
    <!-- type="module" 启用 ES Module 功能 -->
    <script src="/src/main.js" type="module" defer></script>
</head>
<body>
    <div class="noise-bg"></div>
    <!-- 主应用容器 -->
    <div id="app-container">
        <!-- 导航页面 -->
        <div id="navigation-page" class="page active">
            <!-- Background Elements -->
            <div class="menu-grid-overlay"></div>
            <div class="hud-line top"></div>
            <div class="hud-line bottom"></div>
            
            <div class="title-container">
                <h1 class="main-title">Shadowverse:<br>World Beyond</h1>
                <div class="sub-title">Card Battle Development Platform</div>
            </div>

            <div class="nav-menu">
                <!-- Battle Option -->
                <div class="nav-item" data-route="game" role="button" tabindex="0">
                    <div class="nav-icon-bg">
                        <svg viewBox="0 0 100 100" class="icon-svg battle-icon">
                            <defs>
                                <linearGradient id="grad-battle" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" style="stop-color:#ff4f00;stop-opacity:1" />
                                    <stop offset="100%" style="stop-color:#ff0055;stop-opacity:1" />
                                </linearGradient>
                            </defs>
                            <path d="M20,20 L80,80 M80,20 L20,80" stroke="url(#grad-battle)" stroke-width="2" fill="none" class="cross-swords"/>
                            <circle cx="50" cy="50" r="45" stroke="rgba(255, 79, 0, 0.3)" stroke-width="1" fill="none" class="pulse-circle"/>
                        </svg>
                    </div>
                    <div class="nav-content">
                        <div class="nav-text">进入对战</div>
                        <div class="nav-desc">
                            <span class="desc-line">LINK START</span>
                            <span class="desc-detail">体验实时卡牌对战 / 挑战 AI</span>
                        </div>
                    </div>
                </div>

                <!-- Editor Option -->
                <div class="nav-item" data-route="card-editor" role="button" tabindex="0">
                    <div class="nav-icon-bg">
                        <svg viewBox="0 0 100 100" class="icon-svg editor-icon">
                            <defs>
                                <linearGradient id="grad-editor" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" style="stop-color:#00ffcc;stop-opacity:1" />
                                    <stop offset="100%" style="stop-color:#0088ff;stop-opacity:1" />
                                </linearGradient>
                            </defs>
                            <rect x="25" y="15" width="50" height="70" rx="5" stroke="url(#grad-editor)" stroke-width="2" fill="none" class="card-rect"/>
                            <path d="M35,35 L65,35 M35,50 L55,50 M35,65 L65,65" stroke="rgba(0, 255, 204, 0.5)" stroke-width="2" class="data-lines"/>
                        </svg>
                    </div>
                    <div class="nav-content">
                        <div class="nav-text">卡牌工坊</div>
                        <div class="nav-desc">
                            <span class="desc-line">CONSTRUCT</span>
                            <span class="desc-detail">设计专属卡牌 / 编辑能力</span>
                        </div>
                    </div>
                </div>

                <!-- DevTools Option -->
                <div class="nav-item" data-route="dev-tools" role="button" tabindex="0">
                    <div class="nav-icon-bg">
                        <svg viewBox="0 0 100 100" class="icon-svg system-icon">
                            <defs>
                                <linearGradient id="grad-system" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" style="stop-color:#8a2be2;stop-opacity:1" />
                                    <stop offset="100%" style="stop-color:#ff00ff;stop-opacity:1" />
                                </linearGradient>
                            </defs>
                            <polygon points="50,10 90,30 90,70 50,90 10,70 10,30" stroke="url(#grad-system)" stroke-width="2" fill="none" class="hex-gear"/>
                            <circle cx="50" cy="50" r="15" fill="rgba(138, 43, 226, 0.5)" class="core-pulse"/>
                        </svg>
                    </div>
                    <div class="nav-content">
                        <div class="nav-text">系统核心</div>
                        <div class="nav-desc">
                            <span class="desc-line">DEBUG MODE</span>
                            <span class="desc-detail">API 测试 / 数据监控</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 游戏对战页面 -->
        <div id="game-page" class="page">
            <div class="page-header">
                <button class="back-button" data-route="navigation">← 返回主页</button>
                <h2>游戏对战</h2>
            </div>
            <div id="game-container">
                <!-- 对手信息区 (Top Right) -->
                <div id="player2-info" class="player-info opponent-info">
                    <div class="player-avatar-row">
                        <div class="player-avatar">P2</div>
                        <div class="player-name">Opponent</div>
                    </div>
                    <div class="player-stats">
                        <div class="stat hp"><span>HP</span><span>20</span></div>
                        <div class="stat pp">
                            <div class="pp-header"><span>PP</span><span>0/0</span></div>
                            <div class="pp-bar-container">
                                <div class="pp-segment empty"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 战场区域 (Center) -->
                <div id="battlefield">
                    <div id="player2-field" class="field">
                        <!-- 对手随从槽位 -->
                        <div class="slot" data-index="0"></div>
                        <div class="slot" data-index="1"></div>
                        <div class="slot" data-index="2"></div>
                        <div class="slot" data-index="3"></div>
                        <div class="slot" data-index="4"></div>
                    </div>
                    
                    <div id="turn-info">TURN 1</div>

                    <div id="player1-field" class="field">
                        <!-- 玩家随从槽位 -->
                        <div class="slot" data-index="0"></div>
                        <div class="slot" data-index="1"></div>
                        <div class="slot" data-index="2"></div>
                        <div class="slot" data-index="3"></div>
                        <div class="slot" data-index="4"></div>
                    </div>
                </div>

                <!-- 玩家信息区 (Bottom Left) -->
                <div id="player1-info" class="player-info player-info-self">
                    <div class="player-avatar-row">
                        <div class="player-avatar">P1</div>
                        <div class="player-name">Player</div>
                    </div>
                    <div class="player-stats">
                        <div class="stat hp"><span>HP</span><span>20</span></div>
                        <div class="stat pp">
                            <div class="pp-header"><span>PP</span><span>0/0</span></div>
                            <div class="pp-bar-container">
                                <div class="pp-segment empty"></div>
                            </div>
                        </div>
                        <div class="stat deck"><span>DECK</span><span>40</span></div>
                    </div>
                </div>

                <!-- 玩家手牌区 (Bottom Center) -->
                <div id="player-hand" class="hand-container">
                    <!-- 手牌将动态生成 -->
                </div>

                <!-- 操作按钮区 (Bottom Right) -->
                <div class="action-buttons">
                    <button id="end-turn-btn" class="game-btn">End Turn</button>
                </div>
            </div>
        </div>

        <!-- 卡牌编辑器页面 -->
        <div id="card-editor-page" class="page">
            <div class="page-header">
                <button class="back-button" data-route="navigation">← 返回主页</button>
                <h2>卡牌工坊</h2>
            </div>
            <div class="editor-container">
                <div class="editor-sidebar">
                    <button class="editor-nav-btn active" data-target="basic-info">基础信息</button>
                    <button class="editor-nav-btn" data-target="abilities">能力编辑</button>
                    <button class="editor-nav-btn" data-target="visuals">视觉效果</button>
                    <div class="spacer"></div>
                    <button id="save-card-btn" class="primary-btn">保存卡牌</button>
                </div>
                <div class="editor-content">
                    <!-- 动态加载编辑器组件 -->
                    <div id="editor-workspace"></div>
                </div>
            </div>
        </div>

        <!-- 开发者工具页面 -->
        <div id="dev-tools-page" class="page">
            <div class="page-header">
                <button class="back-button" data-route="navigation">← 返回主页</button>
                <h2>系统核心</h2>
            </div>
            <div class="devtools-container">
                <div class="console-output" id="dev-console">
                    <div class="log-entry system">System initialized...</div>
                </div>
                <div class="console-input-wrapper">
                    <span class="prompt">></span>
                    <input type="text" id="console-input" placeholder="输入指令...">
                </div>
            </div>
        </div>
    </div>
</body>
</html>
