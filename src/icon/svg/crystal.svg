<svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="crysTopLeft" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00A8FF" />
      <stop offset="100%" stop-color="#E0FFFF" />
    </linearGradient>
    <linearGradient id="crysTopRight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0066CC" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>
    <linearGradient id="crysBotLeft" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#003399" />
      <stop offset="100%" stop-color="#00A8FF" />
    </linearGradient>
    <linearGradient id="crysBotRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001F66" />
      <stop offset="100%" stop-color="#0055B3" />
    </linearGradient>

    <linearGradient id="silverBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B0C4DE" />
      <stop offset="50%" stop-color="#F8F8FF" />
      <stop offset="100%" stop-color="#778899" />
    </linearGradient>
  </defs>

  <g transform="translate(0, 4)">
    <g opacity="0.8">
      <path d="M 15 48 Q 25 40 40 48 Q 55 40 65 48 Q 55 52 40 54 Q 25 52 15 48 Z" fill="none" stroke="url(#silverBase)" stroke-width="1.5" />
      <path d="M 22 50 Q 40 58 58 50" fill="none" stroke="#778899" stroke-width="1" />
      <circle cx="20" cy="48" r="1.5" fill="#E0FFFF" />
      <circle cx="60" cy="48" r="1.5" fill="#E0FFFF" />
      <circle cx="40" cy="55" r="2" fill="#B0C4DE" />
    </g>

    <ellipse cx="40" cy="35" rx="18" ry="25" fill="#00A8FF" opacity="0.3" filter="url(#glow)" />

    <polygon points="40,10 24,35 40,42" fill="url(#crysTopLeft)" />
    <polygon points="40,10 56,35 40,42" fill="url(#crysTopRight)" />
    <polygon points="24,35 40,65 40,42" fill="url(#crysBotLeft)" />
    <polygon points="56,35 40,65 40,42" fill="url(#crysBotRight)" />
    
    <polyline points="40,10 40,65" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.6" />
    <polyline points="24,35 56,35" fill="none" stroke="#FFFFFF" stroke-width="0.5" opacity="0.4" />
    <polygon points="36,32 44,32 40,42" fill="#FFFFFF" opacity="0.7" filter="url(#glow)"/>

    <circle cx="40" cy="20" r="1" fill="#FFFFFF" filter="url(#glow)" />
    <circle cx="32" cy="45" r="0.8" fill="#E0FFFF" />
    <circle cx="50" cy="25" r="0.5" fill="#E0FFFF" />
  </g>
</svg>