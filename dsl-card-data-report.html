<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DSL 解析报告</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Noto Sans SC", "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f6f5f1;
      color: #1f1f1f;
    }
    body {
      margin: 0;
      padding: 24px;
    }
    h1 {
      font-size: 22px;
      margin: 0 0 12px 0;
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
      font-size: 14px;
    }
    .pill {
      background: #1f1f1f;
      color: #fff;
      padding: 4px 10px;
      border-radius: 999px;
    }
    .status {
      margin: 12px 0 20px 0;
      font-size: 14px;
      color: #555;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th, td {
      text-align: left;
      padding: 8px;
      border-bottom: 1px solid #ddd;
      vertical-align: top;
    }
    th {
      background: #222;
      color: #fff;
      position: sticky;
      top: 0;
      z-index: 1;
    }
    .ok {
      color: #1a7f37;
      font-weight: 600;
    }
    .fail {
      color: #b42318;
      font-weight: 600;
    }
    .expr {
      font-family: "Consolas", "SFMono-Regular", "Menlo", monospace;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .errors {
      color: #b42318;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>DSL 表达式解析报告</h1>
  <div class="meta">
    <span class="pill" id="total-count">总数: -</span>
    <span class="pill" id="success-count">成功: -</span>
    <span class="pill" id="fail-count">失败: -</span>
  </div>
  <div class="status" id="status">等待加载 card_data.json 与解析服务...</div>
  <table>
    <thead>
      <tr>
        <th>CardId</th>
        <th>卡牌</th>
        <th>能力</th>
        <th>分类</th>
        <th>路径</th>
        <th>表达式</th>
        <th>解析</th>
        <th>错误</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <script type="module">
    import { metadataManager } from "./src/metadataManager.js";

    const statusEl = document.getElementById("status");
    const totalEl = document.getElementById("total-count");
    const successEl = document.getElementById("success-count");
    const failEl = document.getElementById("fail-count");
    const rowsEl = document.getElementById("rows");

    const concurrency = 6;

    function extractDslExpressions(cards) {
      const list = [];

      function collectDslFields(node, path, onFound) {
        if (node && typeof node === "object" && !Array.isArray(node)) {
          for (const [key, value] of Object.entries(node)) {
            const nextPath = `${path}.${key}`;
            if ((key === "expression" || key === "formula") && typeof value === "string" && value.trim()) {
              onFound(nextPath, value.trim());
            }
            collectDslFields(value, nextPath, onFound);
          }
          return;
        }
        if (Array.isArray(node)) {
          node.forEach((item, index) => collectDslFields(item, `${path}[${index}]`, onFound));
        }
      }

      function extractFromAbility(ability, abilityPath, cardId, cardName, parentAbilityName, parentAbilityType) {
        let abilityName = ability.name || "";
        let abilityType = ability.type || "";
        if (!abilityName) {
          abilityName = parentAbilityName ? `${parentAbilityName} (chained)` : "(Unnamed Ability)";
        }
        if (!abilityType && parentAbilityType) {
          abilityType = parentAbilityType;
        }

        if (Array.isArray(ability.conditions)) {
          ability.conditions.forEach((condition, conditionIndex) => {
            if (typeof condition.expression === "string" && condition.expression.trim()) {
              list.push({
                cardId,
                cardName,
                abilityName,
                abilityType,
                category: "Condition",
                path: `${abilityPath}.conditions[${conditionIndex}].expression`,
                expression: condition.expression.trim()
              });
            }
          });
        }

        if (Array.isArray(ability.targets)) {
          ability.targets.forEach((target, targetIndex) => {
            const expr = target?.query?.sourcePoolExpression;
            if (typeof expr === "string" && expr.trim()) {
              list.push({
                cardId,
                cardName,
                abilityName,
                abilityType,
                category: "Target",
                path: `${abilityPath}.targets[${targetIndex}].query.sourcePoolExpression`,
                expression: expr.trim()
              });
            }
          });
        }

        if (Array.isArray(ability.effects)) {
          ability.effects.forEach((effect, effectIndex) => {
            const effectType = effect.type || "";
            const effectPath = `${abilityPath}.effects[${effectIndex}]`;
            if (effect && typeof effect.parameters === "object") {
              collectDslFields(effect.parameters, `${effectPath}.parameters`, (path, expr) => {
                list.push({
                  cardId,
                  cardName,
                  abilityName,
                  abilityType,
                  category: effectType ? `Effect (${effectType})` : "Effect",
                  path,
                  expression: expr
                });
              });
            }

            if (Array.isArray(effect.chainedAbilities)) {
              effect.chainedAbilities.forEach((chained, chainedIndex) => {
                extractFromAbility(
                  chained,
                  `${effectPath}.chainedAbilities[${chainedIndex}]`,
                  cardId,
                  cardName,
                  abilityName,
                  abilityType
                );
              });
            }
          });
        }
      }

      cards.forEach((card, cardIndex) => {
        if (!Array.isArray(card.abilities)) return;
        const cardId = card.id ?? 0;
        const cardName = card.name || "";
        card.abilities.forEach((ability, abilityIndex) => {
          extractFromAbility(ability, `[${cardIndex}].abilities[${abilityIndex}]`, cardId, cardName, null, null);
        });
      });

      return list;
    }

    async function parseExpression(expression) {
      const response = await fetch("/api/dsl/parse", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ expression })
      });
      if (!response.ok) {
        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
      }
      return await response.json();
    }

    async function runQueue(items, handler) {
      const results = [];
      let index = 0;

      async function worker() {
        while (index < items.length) {
          const current = index++;
          results[current] = await handler(items[current], current);
        }
      }

      const workers = Array.from({ length: concurrency }, () => worker());
      await Promise.all(workers);
      return results;
    }

    async function main() {
      try {
        statusEl.textContent = "加载 card_data.json...";
        const [cards] = await Promise.all([
          fetch("/data/card_data.json").then((res) => res.json()),
          metadataManager.initialize()
        ]);

        const expressions = extractDslExpressions(cards);
        totalEl.textContent = `总数: ${expressions.length}`;

        statusEl.textContent = "开始解析 DSL 表达式...";
        let successCount = 0;
        let failCount = 0;

        const results = await runQueue(expressions, async (info) => {
          try {
            const parsed = await parseExpression(info.expression);
            if (parsed.success && parsed.root) {
              successCount += 1;
              return { ...info, status: "ok", errors: [] };
            }
            failCount += 1;
            return { ...info, status: "fail", errors: parsed.errors || [] };
          } catch (error) {
            failCount += 1;
            return { ...info, status: "fail", errors: [String(error?.message || error)] };
          }
        });

        successEl.textContent = `成功: ${successCount}`;
        failEl.textContent = `失败: ${failCount}`;
        statusEl.textContent = "解析完成";

        rowsEl.innerHTML = "";
        results.forEach((row) => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${row.cardId}</td>
            <td>${row.cardName || ""}</td>
            <td>${row.abilityName || ""}</td>
            <td>${row.category || ""}</td>
            <td>${row.path || ""}</td>
            <td class="expr">${row.expression}</td>
            <td class="${row.status === "ok" ? "ok" : "fail"}">${row.status === "ok" ? "成功" : "失败"}</td>
            <td class="errors">${row.errors && row.errors.length ? row.errors.join("\\n") : ""}</td>
          `;
          rowsEl.appendChild(tr);
        });
      } catch (error) {
        statusEl.textContent = `初始化失败: ${error?.message || error}`;
      }
    }

    main();
  </script>
</body>
</html>
